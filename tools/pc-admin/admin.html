    c.onchange = () => saveProfiles(overview.profiles.map((x, i) => i === index ? Object.assign({}, x, { enabled: c.checked }) : x),
      p.name + (c.checked ? " is on." : " is off."));
    sw.append(c, el("span"));

      const ok = await modal({ title: "Delete " + p.name + "?", message: "Its rules stop on every device it was given to.", confirmText: "Delete", danger: true });

    row.append(sw, info, button("Edit", "ghost small", null, () => editProfile(index)),

        copy.name = (p.name + " copy").slice(0, 40);
        copy.assign = { devices: [], users: [], groups: [] };
        saveProfiles([...overview.profiles, copy], "Copy made. It is not given to anyone yet.");

}

async function saveProfiles(list, message) {
  const { status, data } = await api("/api/admin/profiles/save", { profiles: list });
  if (status === 200 && message) toast(message);
  await refresh();
  memo.profiles = "";
  update();
  if (status === 200) return null;
  return data.error === "bad_site" ? siteError(data) : "Could not save. Check the profile and try again.";
}

function windowEditor(w, onRemove) {
  const row = el("div", "windowrow");
  const days = new Set(w.days);
  const seg = el("div", "seg days");

    });

  });
  const start = el("input");

  start.setAttribute("aria-label", "Start");
  const end = el("input");
  end.type = "time";

}

/** The profile editor: apps by name (Android and Windows), websites, allow list, limit, timing and who gets it. */
async function editProfile(index) {
  const isNew = index === null;
  const base = isNew
    ? { name: "", enabled: true, apps: [], sites: [], allowSites: [], dailyLimitMinutes: 0, mode: "always", windows: [], assign: { devices: [], users: [], groups: [] } }
    : JSON.parse(JSON.stringify(overview.profiles[index]));
  const form = el("div", "form");
  const name = el("input");
  name.value = base.name;
  name.maxLength = 40;
  name.placeholder = "Like Study Mode";

  // Apps: a built in list names each app once for phones and computers; custom ones can be added.
  const apps = base.apps.map((a) => Object.assign({}, a));
  const chips = el("div", "chips");
  const drawChips = () => {
    chips.replaceChildren();
    const known = overview.knownApps.map((k) => k.name);
    for (const k of overview.knownApps) {
      const on = apps.some((a) => a.name === k.name);
      const b = button(k.name, "chipbtn" + (on ? " on" : ""), on ? "check" : "plus", () => {
        const at = apps.findIndex((a) => a.name === k.name);
        if (at >= 0) apps.splice(at, 1); else apps.push({ name: k.name, android: k.android, windows: k.windows });
        drawChips();
      });
      b.title = [k.android.length ? "Android: " + k.android.join(", ") : "", k.windows.length ? "Windows: " + k.windows.join(", ") : ""].filter(Boolean).join(" · ");
      chips.appendChild(b);
    }
    for (const a of apps.filter((x) => !known.includes(x.name))) {
      const b = button(a.name, "chipbtn on", "check", () => { apps.splice(apps.indexOf(a), 1); drawChips(); });
      b.title = [...a.android, ...a.windows].join(", ");
      chips.appendChild(b);
    }
  };
  drawChips();
  const custom = el("div", "inline wrap");
  const cName = el("input");
  cName.placeholder = "App name";
  const cAndroid = el("input");
  cAndroid.placeholder = "Android package, like com.example.game";
  const cWindows = el("input");
  cWindows.placeholder = "Windows program, like game.exe";
  custom.append(cName, cAndroid, cWindows, button("Add", "ghost small", "plus", () => {
    const n = cName.value.trim();
    const android = cAndroid.value.trim() ? [cAndroid.value.trim()] : [];
    const windows = cWindows.value.trim() ? [cWindows.value.trim().toLowerCase()] : [];
    if (!n || (!android.length && !windows.length)) { toast("Type a name and a package or a program."); return; }
    apps.push({ name: n, android, windows });
    cName.value = cAndroid.value = cWindows.value = "";
    drawChips();
  }));

  const sites = el("input");
  sites.value = base.sites.join(", ");
  sites.placeholder = "tiktok.com, youtube.com/shorts";
  const allow = el("input");
  allow.value = base.allowSites.join(", ");
  allow.placeholder = "kundalik.com, wikipedia.org";
  const limitSel = selectBox([["0", "No limit"], ["30", "30 min"], ["60", "1 h"], ["120", "2 h"], ["180", "3 h"]].concat(
    [0, 30, 60, 120, 180].includes(base.dailyLimitMinutes) ? [] : [[String(base.dailyLimitMinutes), limitText(base.dailyLimitMinutes)]]),
  String(base.dailyLimitMinutes), "Daily limit", () => {});

  // When the rules apply: always, or only inside time windows.
  let mode = base.mode;
  const windowsBox = el("div");
  const windowRows = [];
  const addWindow = (w) => {
    const row = windowEditor(w, () => windowRows.splice(windowRows.indexOf(row), 1));
    windowRows.push(row);
    windowsBox.appendChild(row);
  };
  base.windows.forEach(addWindow);
  const addWindowBtn = button("Add a time", "ghost small", "plus", () => addWindow({ days: [1, 2, 3, 4, 5], start: "08:00", end: "14:00", blockAllApps: false }));
  const timing = el("div");
  timing.append(windowsBox, addWindowBtn);
  const modeSeg = el("div", "seg");
  for (const [value, text] of [["always", "Always"], ["schedule", "Only at set times"]]) {
    const b = button(text, value === mode ? "on" : "", null, () => {
      mode = value;
      for (const other of modeSeg.children) other.classList.toggle("on", other === b);
      timing.classList.toggle("hidden", mode !== "schedule");
      if (mode === "schedule" && !windowRows.length) addWindowBtn.click();
    });
    modeSeg.appendChild(b);
  }
  timing.classList.toggle("hidden", mode !== "schedule");

  const assignGroups = new Set(base.assign.groups);
  const assignUsers = new Set(base.assign.users);
  const assignDevices = new Set(base.assign.devices);

  form.append(
    el("label", "field", "Name"), name,
    el("label", "field", "Apps to block (works on phones and computers)"), chips,
    el("div", "tiny", "Not in the list? Add it with its Android package, its Windows program, or both:"), custom,
    el("label", "field", "Websites to block"), sites,
    el("label", "field", "Only allow these websites (phones only; every other website is blocked)"), allow,
    el("label", "field", "Daily limit"), limitSel,
    el("label", "field", "When"), modeSeg, timing,
    el("label", "field", "Give to groups"), checklist(overview.groups.map((g) => [g.id, g.name]), assignGroups),
    el("label", "field", "Give to users (all their devices)"), checklist(overview.users.map((u) => [u.username, u.username]), assignUsers),
    el("label", "field", "Give to single devices"), checklist(overview.devices.map((d) => [d.id, d.name + " (" + d.user + ")"]), assignDevices)
  );

  await modal({
    title: isNew ? "New profile" : "Edit " + base.name, body: form, wide: true, confirmText: "Save",
    onConfirm: async () => {
      const profile = Object.assign({}, base, {
        name: name.value.trim(), apps, sites: splitSites(sites.value), allowSites: splitSites(allow.value),
        dailyLimitMinutes: Number(limitSel.value), mode, windows: mode === "schedule" ? windowRows.map((r) => r.read()) : [],
        assign: { groups: [...assignGroups], users: [...assignUsers], devices: [...assignDevices] }
      });
      if (!profile.name) return "Give the profile a name.";
      if (mode === "schedule") {
        if (!profile.windows.length) return "Add at least one time, or choose Always.";
        if (profile.windows.some((w) => !w.days.length || !w.start || !w.end || w.start === w.end)) return "Each time needs days, a start and a different end.";
      }
      const list = isNew ? [...overview.profiles, profile] : overview.profiles.map((x, i) => i === index ? profile : x);
      return saveProfiles(list, "Saved. Devices get it within 10 seconds.");
    }
  });
}

// ---------------------------------------------------------------- notifications (bell)
const NOTIFY_LABELS = {
  new_device: "New device or approval request",
  offline: "Device offline for over 10 minutes",
  new_app: "New app found",
  limit_reached: "Daily limit reached",
  sync_failed: "Device could not reach this computer"
};
const NOTIFY_ICONS = { new_device: "devices", offline: "offline", new_app: "sparkle", limit_reached: "clock", sync_failed: "link" };
let bellOpen = false;

function renderBell() {
  const b = $("bellBtn");
  const count = overview ? overview.unread : 0;
  b.replaceChildren(icon("bell"));
  if (count) b.appendChild(el("span", "badge", count > 99 ? "99+" : String(count)));
  b.setAttribute("aria-label", count ? count + " unread notifications" : "Notifications");
  if (bellOpen) renderBellPanel();
}

function renderBellPanel() {
  let panel = $("bellPanel");
  if (!panel) {
    panel = el("div", "card bellpanel");
    panel.id = "bellPanel";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-label", "Notifications");
    document.body.appendChild(panel);
  }
  if (!changed("bell", [overview.notifications])) return;
  panel.replaceChildren();
  const head = el("div", "row");
  head.append(el("div", "grow title", "Notifications"),
    button("Mark all as read", "link", null, async () => { await api("/api/admin/notifications/read", { all: true }); await refresh(); update(); renderBell(); }),
    button("Settings", "link", null, () => { closeBell(); location.hash = "#/settings"; }));
  panel.appendChild(head);
  if (!overview.notifications.length) panel.appendChild(emptyState("bell", "Nothing new."));
  for (const n of overview.notifications) {
    const row = el("div", "row" + (n.device ? " click" : "") + (n.read ? "" : " unread"));
    const ic = el("div", "logicon");
    ic.appendChild(icon(NOTIFY_ICONS[n.type] || "bell"));
    const info = el("div", "grow");
    info.append(el("div", "title wrap", n.text), el("div", "tiny", logTime(n.t)));
    row.append(ic, info);
    if (!n.read) row.appendChild(el("span", "dot on"));
    if (n.device) {
      row.tabIndex = 0;
      const open = async () => {
        await api("/api/admin/notifications/read", { ids: [n.id] });
        closeBell();
        location.hash = "#/devices/" + encodeURIComponent(n.device);
        await refresh();
        renderBell();
      };
      row.onclick = open;
      row.onkeydown = (e) => { if (e.key === "Enter") open(); };
    }
    panel.appendChild(row);
  }
}

function closeBell() {
  bellOpen = false;
  const panel = $("bellPanel");
  if (panel) panel.remove();
  memo.bell = "";
}

$("bellBtn").onclick = (e) => {
  e.stopPropagation();
  if (bellOpen) { closeBell(); return; }
  bellOpen = true;
  memo.bell = "";
  renderBellPanel();
};
document.addEventListener("click", (e) => {
  const panel = $("bellPanel");
  if (bellOpen && panel && !panel.contains(e.target)) closeBell();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && bellOpen) closeBell(); });

async function updateDevProtection(d) {
  if (changed("devProt", [d.protection, d.online, d.received, d.pending, tick()])) {
    const box = $("devProt");
    box.replaceChildren();
    const sync = el("div", "row");
    const syncInfo = el("div", "grow");

    sync.append(syncInfo, d.pending ? pill("Waiting for approval", "warn") : receivedPill(d));
    box.appendChild(sync);

      box.appendChild(el("p", "small muted", isPc(d)
        ? "No report yet. Computers send one with their program list, about every 10 minutes."
        : "No report yet. Phones with the newest Curbox send one every 5 minutes."));

async function restoreBackup(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (e) { toast("This file is not a Curbox backup."); return; }
  const ok = await modal({
    title: "Restore this backup?",
    message: "Everything now in Curbox for PC is replaced by " + f.name + ". Devices linked after the backup will have to sign in again.",
    confirmText: "Restore", danger: true
  });
  if (!ok) return;
  const { status } = await api("/api/admin/restore", { data });
  toast(status === 200 ? "Backup restored." : "This file is not a Curbox backup.");
  await refresh();
  memo = {};
  mount();
}

  if (await saveGlobalSites({ add })) $("globalInput").value = "";
}

async function saveGlobalSites(body) {
  $("globalError").textContent = "";
  const { status, data } = await api("/api/admin/global-sites", body);
  if (status === 200) {
    toast(data.changed ? tr("Saved. Every device gets it within 10 seconds.") : tr("Nothing changed."));
  } else if ($("globalError")) {
    $("globalError").textContent = siteError(data);
  }
  await refresh();
  update();
  return status === 200;
}

// ---------------------------------------------------------------- users
function mountUsers(content) {
  setTitle("Users");
  const grid = el("div", "grid2");
  const list = el("div", "stack");
  const head = card("Users", "users", "People who sign in on phones and computers. Click a device to open it.");
  const search = el("input");
  search.placeholder = "Search by login or device";
  search.setAttribute("aria-label", "Search users");
  search.value = userView.q;
  search.oninput = () => { userView.q = search.value; memo.users = ""; updateUsers(); };
  head.appendChild(search);
  const body = el("div", "usergrid");
  body.id = "userList";
  list.append(head, body);
  userUsageAt = 0;

  const add = card("Add a user", "plus", "They use this login on their device.");
  const name = el("input");
  name.id = "newUser";
  name.placeholder = "Like anvarov";
  const pass = el("input");
  pass.id = "newUserPass";
  pass.type = "password";
  const err = el("div", "error");
  err.id = "userError";
  add.append(
    el("label", "field", "Login"), name,
    el("label", "field", "Password"), pass,
    err, button("Add user", "primary", "plus", addUser)
  );
  // Moving to a new server: bring the logins from a backup of the old one.
  const file = el("input");
  file.type = "file";
  file.accept = "application/json,.json";
  file.className = "hidden";
  file.onchange = () => importUsers(file);
  add.append(el("p", "small muted", "Moving from another computer? Download a backup there (Settings), then import its users here. Everyone keeps their password."),
    button("Import users from a backup", "ghost", "users", () => file.click()), file);
  grid.append(list, add);
  content.appendChild(grid);
}

const userView = { q: "" };
let userUsage = null;
let userUsageAt = 0;

async function updateUsers() {
  if (Date.now() - userUsageAt > 60000) {
    userUsageAt = Date.now();
    const { status, data } = await api("/api/admin/usage?from=" + daysBack(6) + "&to=" + daysBack(0));
    if (status === 200) userUsage = data;
    memo.users = "";
  }
  const body = $("userList");
  if (!body) return;
  const q = userView.q.trim().toLowerCase();
  const users = overview.users.filter((u) => !q || u.username.includes(q)
    || overview.devices.some((d) => d.user === u.username && d.name.toLowerCase().includes(q)));
  if (!changed("users", [users, overview.devices.map((d) => [d.user, d.name, d.platform, d.online]), userUsage && userUsage.dailyTotal, tick()])) return;
  const usage = {};
  if (userUsage) usageByUser(userUsage).forEach((u) => { usage[u.user] = u; });
  body.replaceChildren();
  if (!overview.users.length) body.appendChild(emptyState("users", "No users yet. Add one on the right."));
  else if (!users.length) body.appendChild(emptyState("users", "No users match."));
  for (const u of users) {
    const mine = overview.devices.filter((d) => d.user === u.username);
    const used = usage[u.username];
    const c = el("section", "card ucard");
    const top = el("div", "top");
    const info = el("div", "grow");
    const online = mine.filter((d) => d.online).length;
    info.append(el("div", "title", u.username),
      el("div", "tiny", (mine.length === 1 ? "1 device" : mine.length + " devices") + (online ? " · " + online + " " + tr("online") : "")));
    top.append(el("div", "avatar", u.username.slice(0, 1).toUpperCase()), info);

    const nums = el("div", "nums");
    const today = el("div", "num");
    today.append(el("span", "tiny", "Today"), el("b", "", used ? fmtDur(used.daily[used.daily.length - 1] || 0) : "0m"));
    const week = el("div", "num");
    week.append(el("span", "tiny", "Last 7 days"), el("b", "", used ? fmtDur(used.totalMs) : "0m"));
    nums.append(today, week);

    const chips = el("div", "chips");
    if (!mine.length) chips.appendChild(el("span", "tiny", "This user has no devices."));
    for (const d of mine) {
      const chip = el("span", "chip");
      chip.append(el("span", "dot" + (d.online ? " on" : "")), el("span", "", d.name));
      chip.title = d.model + " · " + osText(d);
      chip.onclick = () => { location.hash = "#/devices/" + encodeURIComponent(d.id); };
      chips.appendChild(chip);
    }

    const actions = el("div", "actions");
    const del = button("", "danger", "trash", () => deleteUser(u, mine));
    del.setAttribute("aria-label", "Delete " + u.username);
    actions.append(button("Apps used", "ghost", "apps", () => showUserApps(u.username, daysBack(6), daysBack(0))),
      button("New password", "ghost", "key", () => newPassword(u)), del);
    c.append(top, nums, chips, el("div", "tiny", tr("Added") + " " + (u.createdAt ? new Date(u.createdAt).toLocaleDateString() : "")), actions);
    body.appendChild(c);
  }
}

async function importUsers(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (e) { toast(tr("This file is not a Curbox backup.")); return; }
  if (!data || !Array.isArray(data.users)) { toast(tr("This file is not a Curbox backup.")); return; }
  const { status, data: res } = await api("/api/admin/users/import", { users: data.users });
  if (status !== 200) { toast(tr("This file is not a Curbox backup.")); return; }
  const added = (res.added || []).length;
  toast(added ? tr("Users added:") + " " + res.added.join(", ") : tr("No new users in this file."));
  await refresh();
  update();
}

async function addUser() {
  const username = $("newUser").value.trim().toLowerCase();
  const password = $("newUserPass").value;
  const { status, data } = await api("/api/admin/users/add", { username, password });
  if (status === 200) {
    $("newUser").value = "";
    $("newUserPass").value = "";
    $("userError").textContent = "";
    toast("User added.");
    await refresh();
    update();
    return;
  }
  const messages = {
    bad_username: "Use 3 to 32 letters, numbers, dots or underscores.",
    too_short: "Use at least 4 characters for the password.",
    exists: "This login is already taken."
  };
  $("userError").textContent = messages[data.error] || "Could not add the user.";
}

async function newPassword(u) {
  const value = await modal({
    title: "New password for " + u.username,
    message: "Use at least 4 characters. Their devices ask for it at the next sign in.",
    input: { type: "password", placeholder: "New password" },
    confirmText: "Save"
  });
  if (value === null) return;
  const { status } = await api("/api/admin/users/password", { username: u.username, password: value });
  toast(status === 200 ? "Password changed." : "Use at least 4 characters.");
}

async function deleteUser(u, mine) {
  const ok = await modal({
    title: "Delete " + u.username + "?",
    message: mine.length ? "These devices stop following your blocks:" : "This user has no devices.",
    list: mine.map((d) => d.name + (isPc(d) ? " (computer)" : " (phone)")),
    confirmText: "Delete", danger: true
  });
  if (!ok) return;
  await api("/api/admin/users/delete", { username: u.username });
  toast("User deleted.");
  await refresh();
  update();
}

// ---------------------------------------------------------------- settings
function mountSettings(content) {
  setTitle("Settings");
  const grid = el("div", "grid2");
  const code = card("Release code", "shield", "A device needs this six digit code to leave management from inside Curbox.");
  const codeState = el("p", "sub");
  codeState.id = "codeState";
  const codeInput = el("input");
  codeInput.id = "codeInput";
  codeInput.type = "password";
  codeInput.inputMode = "numeric";
  codeInput.maxLength = 6;
  codeInput.autocomplete = "off";
  codeInput.placeholder = "6 digits";
  codeInput.setAttribute("aria-label", "New release code");
  codeInput.onkeydown = (e) => { if (e.key === "Enter") saveCode(false); };
  const codeErr = el("div", "error");
  codeErr.id = "codeError";
  const codeButtons = el("div", "inline");
  const clear = button("Remove code", "ghost", "trash", () => saveCode(true));
  clear.id = "codeClear";
  codeButtons.append(button("Save code", "primary", "check", () => saveCode(false)), clear);
  code.append(codeState, codeInput, codeErr, codeButtons,
    el("p", "small muted", "The code is saved as a hash, so nobody can read it back, not even you. Five wrong tries lock that device out for 5 minutes. On a normal phone the owner can still uninstall Curbox in Android settings; the code only controls the release inside Curbox."));
  const approval = card("New devices", "devices");
  const approvalRow = el("label", "choice");
  const approvalBox = el("input");
  approvalBox.type = "checkbox";
  approvalBox.id = "approveNew";
  approvalBox.onchange = async () => {
    const { status } = await api("/api/admin/settings", { approveNewDevices: approvalBox.checked });
    toast(status === 200 ? (approvalBox.checked ? "New devices now wait for your approval." : "New devices are now accepted right away.") : "Could not save. Try again.");
    await refresh();
    update();
  };
  approvalRow.append(approvalBox, document.createTextNode("Approve new devices before rules apply"));
  approval.append(approvalRow, el("p", "small muted", "When this is on, a device that signs in for the first time waits on the Dashboard until you approve it. Devices you already have are not affected."));
  const left = el("div", "stack");
  left.append(approval, code);

  const net = card("Connection", "link", "Phones and computers on the same WiFi use this address.");
  const box = el("div");
  box.id = "settingsConnect";
  net.appendChild(box);

  const about = card("About", null);
  about.append(
    el("p", "", "Curbox for PC, version 1.0.0"),
    el("p", "muted", "Curbox for PC manages phones and computers on your own network. Nothing goes to the internet."),
    el("p", "muted small", "Sessions end after 12 hours without use. Five wrong passwords lock that login for 5 minutes.")
  );
  const right = el("div");
  right.style.display = "grid";
  right.style.gap = "16px";
  right.append(net, about);
  mountSettingsExtras(right);
  grid.append(left, right);
  content.appendChild(grid);
}

function updateSettings() {
  $("codeState").replaceChildren(overview.releaseCodeSet
    ? pill("Code is set" + (overview.releaseCodeSetAt ? " on " + new Date(overview.releaseCodeSetAt).toLocaleDateString() : ""), "ok", "check")
    : pill("No code yet. Devices cannot release themselves until you set one.", "warn"));
  $("codeClear").classList.toggle("hidden", !overview.releaseCodeSet);
  $("approveNew").checked = !!overview.approveNewDevices;
  if (changed("settingsConnect", [overview.addresses])) connectSteps($("settingsConnect"));
  updateSettingsExtras();
}

async function saveCode(clear) {
  const err = $("codeError");
  err.textContent = "";
  if (clear) {
    const ok = await modal({
      title: "Remove the release code?",
      message: "Devices can no longer release themselves. You can still remove a device here.",
      confirmText: "Remove code", danger: true
    });
    if (!ok) return;
  }
  const body = clear ? { clear: true } : { code: $("codeInput").value.trim() };
  const { status, data } = await api("/api/admin/release-code", body);
  if (status === 200) {
    $("codeInput").value = "";
    toast(clear ? "Release code removed." : "Release code saved.");
    await refresh();
    update();
    return;
  }
  err.textContent = data.error === "weak_code"
    ? "This code is too easy to guess. Avoid 123456 or the same digit six times."
    : "Type exactly six digits.";
}

// ---------------------------------------------------------------- go
buildNav();
renderPassToggle();
$("logoutBtn").before(langButton());
$("userModeBtn").after(langButton());
startTranslation();
start();
</script>
