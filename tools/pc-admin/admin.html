<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curbox for PC</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #F6F7FB; --surface: #FFFFFF; --text: #20243A; --muted: #858BA3; --line: #E6E8F0;
    --primary: #5B6EE1; --primary-soft: #E7EAFC; --on-primary: #FFFFFF; --secondary: #8B9CF5;
    --ok: #25A56A; --ok-soft: #E2F4EB; --warn: #A86100; --warn-soft: #FDF1DE;
    --err: #E05260; --err-soft: #FBE7E9; --shadow: 0 1px 2px rgba(32,36,58,.04), 0 6px 20px rgba(32,36,58,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141C; --surface: #1B1E29; --text: #ECEEF6; --muted: #9AA0B8; --line: #2A2E3D;
      --primary: #8B9CF5; --primary-soft: #2B3266; --on-primary: #12141C; --secondary: #A9B5F8;
      --ok: #3CC387; --ok-soft: #173326; --warn: #F5BC63; --warn-soft: #3A2F1B;
      --err: #EE6B78; --err-soft: #3A1E24; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 9px 16px; display: inline-flex; align-items: center; gap: 8px; }
  button.primary { background: var(--primary); color: var(--on-primary); font-weight: 600; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--err-soft); color: var(--err); font-weight: 600; }
  button.link { background: none; color: var(--primary); padding: 6px 0; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  input { font: inherit; width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .hidden { display: none !important; }
  .error { color: var(--err); min-height: 1.3em; font-size: 14px; margin-top: 8px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); }
  .card h2 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .card .sub { margin: 0 0 14px; }

  /* Login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  #login .card { width: 100%; max-width: 400px; padding: 28px; }
  #login .brand { text-align: center; margin-bottom: 8px; }
  #login .brand img { width: 76px; height: 76px; border-radius: 20px; }
  #login h1 { font-size: 22px; margin: 12px 0 2px; }
  .pw { position: relative; }
  .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; color: var(--muted); padding: 6px; }
  #login button.primary { width: 100%; justify-content: center; margin-top: 16px; padding: 13px; }
  #userModeBtn, #userLinkBtn, #userOtherBtn, #userBackBtn { width: 100%; justify-content: center; margin-top: 10px; padding: 11px; }

  /* Shell */
  #app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  aside { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  aside .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 700; }
  aside .brand img { width: 34px; height: 34px; border-radius: 10px; }
  nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 2px; }
  nav a:hover { background: var(--bg); color: var(--text); }
  nav a.active { background: var(--primary-soft); color: var(--primary); }
  aside .foot { margin-top: auto; padding: 10px 12px; }
  main { min-width: 0; }
  header.top { display: flex; align-items: center; gap: 12px; padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
  header.top h1 { font-size: 20px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; background: var(--primary-soft); color: var(--primary); font-family: Consolas, monospace; }
  #content { padding: 24px 28px 40px; display: grid; gap: 16px; }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; align-items: center; padding: 8px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    aside .brand span, aside .foot { display: none; }
    aside .brand { padding: 0 8px 0 4px; }
    nav { display: flex; gap: 4px; }
    nav a { white-space: nowrap; margin: 0; }
    header.top { padding: 12px 16px; position: static; flex-wrap: wrap; }
    #content { padding: 16px; }
    .grid2 { grid-template-columns: 1fr !important; }
  }

  /* Pieces */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .stat { display: flex; flex-direction: column; gap: 10px; }
  .stat .icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .stat .value { font-size: 28px; font-weight: 700; line-height: 1; }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.click { cursor: pointer; border-radius: 12px; padding: 11px 8px; margin: 0 -8px; }
  .row.click:hover { background: var(--bg); }
  .grow { flex: 1; min-width: 0; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tiny { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .typeicon { width: 38px; height: 38px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; font-weight: 700; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .pill.blocked { background: var(--err-soft); color: var(--err); }
  .pill.allowed { background: var(--primary-soft); color: var(--primary); }
  .pill svg.ic { width: 14px; height: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: 0 10px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 10px; border-bottom: 1px solid var(--line); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--bg); }
  tbody tr:last-child td { border-bottom: 0; }
  .tablewrap { overflow-x: auto; }
  .empty { text-align: center; padding: 28px 10px; color: var(--muted); }
  .empty svg.ic { width: 34px; height: 34px; color: var(--primary); margin-bottom: 6px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .site { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); padding: 5px 6px 5px 12px; border-radius: 99px; }
  .site button { padding: 3px 8px; border-radius: 99px; background: none; color: var(--err); font-size: 13px; font-weight: 600; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; padding: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 24px; transition: .2s; }
  .switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--err); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
  .applist { max-height: 60vh; overflow: auto; margin-top: 10px; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  ol.steps { margin: 6px 0 0; padding-left: 20px; }
  ol.steps li { margin: 4px 0; }
  .addr { font-family: Consolas, monospace; font-size: 18px; font-weight: 700; color: var(--primary); }
  select { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  select:focus { outline: 2px solid var(--primary); border-color: transparent; }
  input[type=checkbox], input[type=radio] { width: 18px; height: 18px; padding: 0; margin: 0; accent-color: var(--primary); cursor: pointer; flex: none; }
  input[type=checkbox]:disabled { cursor: default; opacity: .35; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar input:not([type]) { flex: 1 1 220px; width: auto; }
  .bulkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--primary-soft); margin-bottom: 12px; }
  .bulkbar .title { margin-right: auto; color: var(--primary); }
  th.check, td.check { width: 34px; padding-right: 0; }
  tr.picked td { background: var(--primary-soft); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs a:hover { color: var(--text); }
  .tabs a.active { color: var(--primary); border-color: var(--primary); }
  .stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .pill.ok, .pill.new { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); white-space: normal; }
  .pill.muted { background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: normal; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 10px 18px; margin: 6px 0 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { padding: 7px 14px; border-radius: 9px; background: none; color: var(--muted); font-weight: 600; }
  .seg button.on { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(32,36,58,.12); }
  .cap { display: flex; gap: 10px; padding: 7px 0; align-items: flex-start; }
  .cap svg.ic { color: var(--ok); margin-top: 1px; }
  .cap.no { color: var(--muted); }
  .cap.no svg.ic { color: var(--warn); }
  .choices { margin-top: 12px; }
  .choice { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; white-space: nowrap; }
  .logicon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); flex: none; }
  .logicon svg.ic { width: 18px; height: 18px; }
  .logicon.fail { background: var(--err-soft); color: var(--err); }
  .title.wrap { white-space: normal; overflow-wrap: anywhere; }
  .grid2 > *, #content > * { min-width: 0; }
  .time { font-size: 12px; color: var(--muted); white-space: nowrap; }
  button.small { padding: 6px 12px; font-size: 13px; }
  .modal .chips { margin-top: 10px; }
  .modal input { margin-top: 4px; }
  svg.chart { width: 100%; height: auto; max-height: 240px; display: block; }
  svg.chart .track { fill: var(--bg); }
  svg.chart .bar { fill: var(--primary); }
  svg.chart g:hover .bar { fill: var(--secondary); }
  svg.chart .label { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .meter { height: 6px; border-radius: 6px; background: var(--bg); margin-top: 6px; overflow: hidden; min-width: 60px; }
  .meter span { display: block; height: 100%; border-radius: 6px; background: var(--primary); }
  .value { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .strong { font-weight: 700; }
  table.plain tbody tr { cursor: default; }
  table.plain tbody tr:hover td { background: none; }
  table.plain td .title { max-width: 260px; }
  a.btnlink { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--line); color: var(--text); text-decoration: none; }
  a.btnlink:hover { background: var(--bg); }
  input[type=date] { width: auto; padding: 9px 12px; }
  .printonly { display: none; }
  .usergrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .ucard { display: flex; flex-direction: column; gap: 12px; }
  .ucard .top { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; background: var(--primary-soft); color: var(--primary); flex: none; }
  .ucard .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ucard .num { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .ucard .num b { display: block; font-size: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; max-width: 100%; }
  .chip .dot { flex: none; }
  .chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ucard .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
  tr.click { cursor: pointer; }
  .msgform textarea { width: 100%; min-height: 110px; resize: vertical; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; box-sizing: border-box; }
  .msgform .counter { text-align: right; }
  .msgform img { max-width: 100%; max-height: 220px; border-radius: 12px; display: block; margin-top: 8px; }
  .msgrow .text { white-space: pre-wrap; word-break: break-word; }
  tr.click:hover td { background: var(--primary-soft); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .rank { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--primary-soft); color: var(--primary); flex: none; }
  .qrbox { display: flex; gap: 16px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .qrbox img { border-radius: 12px; background: #fff; image-rendering: pixelated; }
  .qrbox a { word-break: break-all; display: block; margin: 6px 0; color: var(--primary); }
  img.qrbig { width: 100%; max-width: 360px; display: block; margin: 12px auto 0; background: #fff; border-radius: 12px; image-rendering: pixelated; }
  #login .langbtn { margin: 14px auto 0; display: flex; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .iconbtn { padding: 8px 10px; position: relative; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .bellpanel { position: fixed; top: 64px; right: 16px; width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 90px); overflow: auto; z-index: 40; }
  .row.unread .title { font-weight: 700; }
  .rulegroup { padding: 10px 0; border-top: 1px solid var(--line); }
  .rulegroup:first-of-type { border-top: 0; }
  .ruleline { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; flex-wrap: wrap; }
  .ruleline .tiny { white-space: normal; }
  .wraptext { white-space: normal; }
  .chipbtn { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 13px; }
  .chipbtn svg.ic { width: 14px; height: 14px; }
  .chipbtn.on { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  .inline.wrap { flex-wrap: wrap; margin-top: 6px; }
  .inline.wrap input { flex: 1 1 160px; width: auto; }
  .windowrow { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 8px; display: grid; gap: 8px; }
  .switch.on input:checked + span { background: var(--primary); }
  .modal { max-height: calc(100vh - 40px); overflow: auto; }
  .modal.wide { max-width: 640px; }
  .form .seg.days button { min-width: 48px; }
  .picklist { max-height: 200px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin-top: 8px; }
  .picklist .choice { white-space: normal; }
  input[type=time] { width: auto; }
  .warntext { color: var(--warn); margin: 8px 0 0; }
  .weekgrid { display: grid; grid-template-columns: 38px repeat(24, minmax(8px, 1fr)); gap: 3px; align-items: center; overflow-x: auto; }
  .weekgrid .hour { font-size: 10px; color: var(--muted); }
  .weekgrid .dayname { font-size: 12px; color: var(--muted); font-weight: 600; }
  .weekgrid .cell { height: 20px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
  .weekgrid .cell.on { background: var(--primary); border-color: var(--primary); }
  .weekgrid .cell.both { background: var(--warn); border-color: var(--warn); }
  @media print {
    body { background: #fff; color: #000; }
    aside, header.top, .noprint, #toast, .backdrop { display: none !important; }
    #app { display: block; }
    #content { padding: 0; gap: 12px; }
    .printonly { display: block; }
    .printonly h1 { font-size: 20px; margin: 0 0 4px; }
    .card { box-shadow: none; border-color: #ccc; break-inside: avoid; background: #fff; }
    .grid2 { grid-template-columns: 1fr 1fr; }
    svg.chart .track { fill: #f1f1f4; }
    svg.chart .bar, .meter span { fill: #5B6EE1; background: #5B6EE1; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* Modal and toast */
  .backdrop { position: fixed; inset: 0; background: rgba(18,20,28,.45); display: grid; place-items: center; padding: 20px; z-index: 50; }
  .modal { width: 100%; max-width: 420px; }
  .modal h2 { font-size: 18px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal ul { margin: 8px 0 0; padding-left: 20px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 10px 18px; border-radius: 12px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<section id="login" class="hidden">
  <div class="card">
    <div class="brand">
      <img src="/logo.png" alt="">
      <h1>Curbox for PC</h1>
      <div class="muted">Sign in to manage phones and computers</div>
    </div>
    <label class="field" for="loginUser">Login</label>
    <input id="loginUser" autocomplete="username">
    <label class="field" for="loginPass">Password</label>
    <div class="pw">
      <input id="loginPass" type="password" autocomplete="current-password">
      <button id="togglePass" type="button" aria-label="Show password"></button>
    </div>
    <div id="loginError" class="error"></div>
    <button class="primary" id="loginBtn">Sign in</button>
    <button class="ghost" id="userModeBtn" type="button">I am a user: link this computer</button>
  </div>
  <div class="card hidden" id="userCard">
    <div class="brand">
      <img src="/logo.png" alt="">
      <h1>Link this computer</h1>
      <div class="muted">Sign in with the login your admin gave you. Then the admin can block programs and websites on this computer.</div>
    </div>
    <div id="userAddressBox" class="hidden">
      <label class="field" for="userAddress">Server address</label>
      <input id="userAddress" placeholder="192.168.1.5:8787" autocomplete="off">
    </div>
    <label class="field" for="userLogin">Login</label>
    <input id="userLogin" autocomplete="username">
    <label class="field" for="userPass">Password</label>
    <input id="userPass" type="password" autocomplete="current-password">
    <div id="userError" class="error"></div>
    <button class="primary" id="userLinkBtn">Link this computer</button>
    <button class="ghost" id="userOtherBtn" type="button">Use another server address</button>
    <button class="ghost" id="userBackBtn" type="button">Back to admin sign in</button>
  </div>
</section>

<div id="app" class="hidden">
  <aside>
    <div class="brand"><img src="/logo.png" alt=""><span>Curbox for PC</span></div>
    <nav id="nav"></nav>
    <div class="foot small muted">Sessions end after 12 hours without use.</div>
  </aside>
  <main>
    <header class="top">
      <h1 id="pageTitle"></h1>
      <span id="addrChip" class="chip"></span>
      <button class="ghost iconbtn" id="bellBtn" aria-label="Notifications"></button>
      <span id="adminChip" class="small muted"></span>
      <button class="ghost" id="logoutBtn"></button>
    </header>

function icon(name) {
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "ic");
  svg.setAttribute("aria-hidden", "true");
  for (const [tag, attrs] of ICONS[name] || []) {
    const node = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    svg.appendChild(node);
  }
  return svg;
}

// Text from devices goes in through textContent only.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function button(text, className, iconName, onClick) {
  const b = el("button", className);
  if (iconName) b.appendChild(icon(iconName));
  if (text) b.appendChild(document.createTextNode(text));
  if (onClick) b.onclick = onClick;
  return b;
}

let lang = localStorage.getItem("curboxLang") || ((navigator.language || "").toLowerCase().startsWith("uz") ? "uz" : "en");

function tr(text) {
  if (lang !== "uz" || !text) return text;
  const key = text.trim();
  if (!key) return text;
  let out = UZ[key];
  if (out === undefined) {
    for (const [re, rep] of UZ_PATTERNS) {
      if (re.test(key)) { out = key.replace(re, rep); break; }
    }
  }
  return out === undefined ? text : text.replace(key, out);
}

function translateTree(root) {
  if (lang !== "uz") return;
  if (root.nodeType === Node.TEXT_NODE) {
    const next = tr(root.nodeValue);
    if (next !== root.nodeValue) root.nodeValue = next;
    return;
  }
  if (root.nodeType !== Node.ELEMENT_NODE) return;
  for (const attr of ["placeholder", "title", "aria-label"]) {
    const v = root.getAttribute(attr);
    if (v) {
      const next = tr(v);
      if (next !== v) root.setAttribute(attr, next);
    }
  }
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let node = walker.nextNode();
  while (node) {
    if (node.nodeType === Node.TEXT_NODE) {
      const next = tr(node.nodeValue);
      if (next !== node.nodeValue) node.nodeValue = next;
    } else if (node.tagName !== "SCRIPT" && node.tagName !== "STYLE") {
      for (const attr of ["placeholder", "title", "aria-label"]) {
        const v = node.getAttribute(attr);
        if (v) {
          const next = tr(v);
          if (next !== v) node.setAttribute(attr, next);
        }
      }
    }
    node = walker.nextNode();
  }
}

function startTranslation() {
  document.documentElement.lang = lang === "uz" ? "uz" : "en";
  if (lang !== "uz") return;
  translateTree(document.body);
  document.title = tr(document.title);
  new MutationObserver((changes) => {
    for (const c of changes) {
      if (c.type === "characterData") translateTree(c.target);
      else if (c.type === "attributes") translateTree(c.target);
      else c.addedNodes.forEach((n) => translateTree(n));
    }
    const t = tr(document.title);
    if (t !== document.title) document.title = t;
  }).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["placeholder", "title", "aria-label"] });
}

async function api(path, body) {
  const options = body === undefined ? { method: "GET" } : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  };
  let res;
  try {
    res = await fetch(path, options);
  } catch (e) {
    // The app was closed or restarted; say so once instead of failing silently.
    if (!offlineShown) toast(tr("Curbox for PC is not answering. Check that it is still running."));
    offlineShown = true;
    return { status: 0, data: {} };
  }
  offlineShown = false;
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (res.status === 401 && path !== "/api/admin/login") showLogin();
  return { status: res.status, data };
}
let offlineShown = false;

function timeAgo(ms) {
  if (!ms) return "Never";
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return lang === "uz" ? "Hozirgina" : "Just now";
  if (s < 3600) return Math.round(s / 60) + (lang === "uz" ? " daqiqa oldin" : " min ago");
  if (s < 86400) return Math.round(s / 3600) + (lang === "uz" ? " soat oldin" : " h ago");
  return new Date(ms).toLocaleDateString();
}

function isPc(d) { return d.platform === "windows"; }

  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

/**
 * A small dialog. Resolves to the typed text (with input or field), the picked choice,
 * true (confirmed) or null. onConfirm may return an error text to keep it open.
 */
function modal({ title, message, list, input, field: givenField, body, choices, confirmText, danger, onConfirm, wide }) {
  return new Promise((resolve) => {
    const back = el("div", "backdrop");
    const box = el("div", "card modal" + (wide ? " wide" : ""));
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    box.appendChild(el("h2", "", title));
    if (message) box.appendChild(el("p", "muted", message));
    if (list && list.length) {
      const ul = el("ul");
      list.forEach((item) => ul.appendChild(el("li", "", item)));
      box.appendChild(ul);
    }
    let field = givenField || null;
    if (input) {
      field = el("input");
      field.type = input.type || "text";
      field.placeholder = input.placeholder || "";
    }
    if (field) box.appendChild(field);
    if (body) box.appendChild(body);
    let picked = choices && choices.length ? choices[0].value : null;
    if (picked !== null) {
      const group = el("div", "choices");
      group.setAttribute("role", "radiogroup");
      const name = "choice" + Date.now();
      choices.forEach((c, i) => {
        const row = el("label", "choice");
        const radio = el("input");
        radio.type = "radio";
        radio.name = name;
        radio.checked = i === 0;
        radio.onchange = () => { picked = c.value; };
        row.append(radio, document.createTextNode(c.label));
        group.appendChild(row);
      });
      box.appendChild(group);
    }
    const err = el("div", "error");
    box.appendChild(err);
    const actions = el("div", "actions");
    const close = (value) => { back.remove(); resolve(value); };
    const okButton = button(confirmText || "OK", danger ? "danger" : "primary", null, () => confirm());
    const confirm = async () => {
      if (okButton.disabled) return;
      const value = field ? field.value : (picked !== null ? picked : true);
      if (onConfirm) {
        okButton.disabled = true;
        err.textContent = "";
        const problem = await onConfirm(value);
        okButton.disabled = false;
        if (problem) { err.textContent = problem; return; }
      }
      close(value);
    };
    actions.append(button("Cancel", "ghost", null, () => close(null)), okButton);
    box.appendChild(actions);
    back.appendChild(box);
    back.onclick = (e) => { if (e.target === back) close(null); };
    back.onkeydown = (e) => {
      if (e.key === "Escape") close(null);
      if (e.key === "Enter" && field) confirm();
    };
    document.body.appendChild(back);
    (field || actions.lastChild).focus();
  });
}

  $("loginError").textContent = "";

  const nav = $("nav");

    const a = el("a");

async function start() {
  const { data } = await api("/api/admin/state");
  if (!data.loggedIn) { showLogin(); return; }
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  await refresh();
  mount();
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => { await refresh(); update(); }, 5000);
}

async function refresh() {
  const { status, data } = await api("/api/admin/overview");
  if (status === 200) {
    overview = data;
    for (const d of overview.devices.concat(overview.removed || [])) {
      d.model = d.name;
      if (d.fullName) d.name = d.fullName;
    }
  }
  if (!overview) return;
  const addresses = overview.addresses || [];
  $("addrChip").replaceChildren(icon("link"), document.createTextNode(addresses[0] || "No network"));
  $("addrChip").title = addresses.length ? "Devices connect at " + addresses.join(", ") : "Connect this computer to WiFi";
  $("adminChip").textContent = overview.adminUser;
  renderBell();
}

function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const page = PAGES.some((p) => p.id === parts[0]) ? parts[0] : "dashboard";
  const tab = DEVICE_TABS.includes(parts[2]) ? parts[2] : "overview";
  return { page, id: parts[1] ? decodeURIComponent(parts[1]) : null, tab };
}

window.onhashchange = () => { if (overview) mount(); };

/** Builds the page frame once per route; update() fills it and runs on every poll. */
function mount() {
  route = parseRoute();
  for (const a of $("nav").children) a.classList.toggle("active", a.dataset.page === route.page);
  const content = $("content");
  content.replaceChildren();
  memo = {};
  if (route.page === "devices" && route.id) mountDevice(content);
  else ({ dashboard: mountDashboard, devices: mountDevices, users: mountUsers, activity: mountActivity, reports: mountReports, screentime: mountScreenTime, schedules: mountSchedules, groups: mountGroups, profiles: mountProfiles, websites: mountWebsites, settings: mountSettings })[route.page](content);
  update();
}

function update() {
  if (!overview || $("app").classList.contains("hidden")) return;
  if (route.page === "devices" && route.id) updateDevice();
  else ({ dashboard: updateDashboard, devices: updateDevices, users: updateUsers, activity: updateActivity, reports: updateReports, screentime: updateScreenTime, schedules: updateSchedules, groups: updateGroups, profiles: updateProfiles, websites: updateWebsites, settings: updateSettings })[route.page]();
}

function platformOf(d) { return d.platform === "windows" ? "windows" : "android"; }
function osText(d) { return d.osVersion || (isPc(d) ? "Windows" : "Android"); }

function selectBox(options, value, label, onChange) {
  const s = el("select");
  s.setAttribute("aria-label", label);
  for (const [v, text] of options) {
    const o = el("option", "", text);
    o.value = v;
    s.appendChild(o);
  }
  s.value = value;
  s.onchange = () => onChange(s.value);
  return s;
}

function checkbox(checked, label, onChange) {
  const box = el("input");
  box.type = "checkbox";
  box.checked = checked;
  box.setAttribute("aria-label", label);
  box.onclick = (e) => e.stopPropagation();
  box.onchange = () => onChange(box.checked);
  return box;
}

function pill(text, kind, iconName) {
  const p = el("span", "pill " + kind);
  if (iconName) p.appendChild(icon(iconName));
  p.appendChild(document.createTextNode(text));
  return p;
}

function filteredDevices() {
  const q = devFilter.q.trim().toLowerCase();
  return overview.devices
    .filter((d) => devFilter.type === "all" || platformOf(d) === devFilter.type)
    .filter((d) => devFilter.state === "all" || (devFilter.state === "online") === d.online)
    .filter((d) => !q || d.name.toLowerCase().includes(q) || d.user.includes(q))
    .filter((d) => !devFilter.group || ((overview.groups || []).find((g) => g.id === devFilter.group) || { deviceIds: [] }).deviceIds.includes(d.id))
    .sort((a, b) => devFilter.sort === "seen" ? (b.lastSeen - a.lastSeen) : a.name.localeCompare(b.name));

function updateDevices() {

function siteError(data) {
  if (data && data.error === "bad_site") {
    return "“" + data.site + "” is not a website. Type a domain like youtube.com or a path like youtube.com/shorts.";
  }
  return "Could not save. Try again.";
}

function splitSites(text) { return text.split(/[\s,]+/).map((s) => s.trim()).filter(Boolean); }

const CATEGORY_LABELS = { social: "Social media", video: "Video", gaming: "Gaming" };

/** Block websites on several devices; the category buttons fill in popular ones. */
async function bulkSites(ids) {
  const names = overview.devices.filter((d) => ids.includes(d.id)).map((d) => d.name);
  const quick = el("div", "chips");
  const field = el("input");
  field.placeholder = "youtube.com, tiktok.com";
  for (const [key, sites] of Object.entries(overview.categories || {})) {
    quick.appendChild(button(CATEGORY_LABELS[key] || key, "ghost small", "plus", () => {
      const current = new Set(splitSites(field.value));
      sites.forEach((s) => current.add(s));
      field.value = [...current].join(", ");
      field.focus();
    }));
  }
  let updated = 0;
  const done = await modal({
    title: "Block websites on " + (ids.length === 1 ? names[0] : ids.length + " devices"),
    message: "Type websites separated by commas, or add a group below.",
    field, body: quick, confirmText: "Block",
    onConfirm: async (value) => {
      const add = splitSites(value);
      if (!add.length) return "Type at least one website.";
      const { status, data } = await api("/api/admin/sites/bulk", { deviceIds: ids, add });
      updated = data.updated || 0;
      return status === 200 ? null : siteError(data);
    }
  });
  if (done === null) return;
  toast(updated ? "Blocked on " + updated + (updated === 1 ? " device." : " devices.") : "Those websites were already blocked.");
  await refresh();
  update();
}

async function removeDevices(ids) {
  const chosen = overview.devices.filter((d) => ids.includes(d.id));
  if (!chosen.length) return false;
  const ok = await modal({
    title: chosen.length === 1 ? "Remove " + chosen[0].name + "?" : "Remove " + chosen.length + " devices?",
    message: "Management stops and every block is lifted the next time the device checks in. A device that is off releases when it comes back. To manage it again, sign in on the device.",
    list: chosen.length > 1 ? chosen.map((d) => d.name) : null,
    confirmText: "Remove", danger: true
  });
  if (!ok) return false;
  await api("/api/admin/remove", { deviceIds: chosen.map((d) => d.id) });
  chosen.forEach((d) => selected.delete(d.id));
  toast(chosen.length === 1 ? "Device removed." : chosen.length + " devices removed.");
  await refresh();
  if (route.page === "devices" && !route.id) redrawDevices();
  return true;
}

/** Focus time: until it ends, phones open only calls, the clock and emergency screens. */
async function focusDialog(targets, all) {
  const phones = (all ? overview.devices : targets).filter((d) => !isPc(d));
  if (!phones.length) { toast("Focus time works on phones only."); return; }

  const minutes = await modal({

    choices: [15, 30, 45, 60, 90, 120].map((m) => ({ value: m, label: m < 60 ? m + " min" : limitText(m).replace(" a day", "") })),
    confirmText: "Start"
  });

async function setFocus(phones, all, minutes) {

  toast(status !== 200 ? "Could not save. Try again." : minutes ? "Focus time started. Phones get it within 10 seconds." : "Focus time ended.");
  await refresh();
  memo = {};
  update();
}

/** A picture made smaller (at most 1080 px) so it reaches the phone quickly. */
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("image"));
      img.onload = () => {
        const scale = Math.min(1, 1080 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/** Sends a message the phones show on the whole screen within about 10 seconds. */
async function sendMessageTo(targets) {
  const phones = targets.filter((d) => !isPc(d));
  if (!phones.length) { toast("Messages work on phones only."); return; }
  let image = "";
  const form = el("div", "msgform stack");
  const text = el("textarea");
  text.maxLength = 500;
  text.placeholder = "Get ready for class!";
  text.setAttribute("aria-label", "Message text");
  const counter = el("div", "tiny counter", "0 / 500");
  text.oninput = () => { counter.textContent = text.value.length + " / 500"; };
  const file = el("input");
  file.type = "file";
  file.accept = "image/jpeg,image/png";
  file.className = "hidden";
  const preview = el("div");
  const pick = button("Add a picture", "ghost", "plus", () => file.click());
  const clear = button("Remove picture", "ghost", "trash", () => { image = ""; preview.replaceChildren(); clear.classList.add("hidden"); });
  clear.classList.add("hidden");
  file.onchange = async () => {
    const f = file.files && file.files[0];
    file.value = "";
    if (!f) return;
    try {
      image = await shrinkImage(f);
    } catch (e) {
      toast("This picture could not be read. Use a JPG or PNG.");
      return;
    }
    const img = el("img");
    img.src = image;
    img.alt = "";
    preview.replaceChildren(img);
    clear.classList.remove("hidden");
  };
  const tools = el("div", "inline wrap");
  tools.append(pick, clear, file);
  form.append(text, counter, tools, preview);
  setTimeout(() => text.focus(), 50);
  const names = phones.map((d) => d.name);
  const ok = await modal({
    title: "Send a message",
    message: (phones.length === 1 ? names[0] : phones.length + " " + tr("phones") + ": " + names.slice(0, 5).join(", ") + (names.length > 5 ? "…" : ""))
      + ". " + tr("It opens on the whole screen of the phone."),
    body: form, confirmText: "Send", wide: true,
    onConfirm: async () => {
      if (!text.value.trim()) return tr("Type the message.");
      const { status, data } = await api("/api/admin/message", { deviceIds: phones.map((d) => d.id), text: text.value.trim(), image });
      if (status === 200) return "";
      return tr(data.error === "bad_image" ? "This picture is too big or not a JPG or PNG." : "Could not send. Try again.");
    }
  });
  if (!ok) return;
  toast(phones.length === 1 ? "Sent. The phone shows it within 10 seconds." : "Sent to " + phones.length + " phones.");
  await refresh();
  memo = {};
  update();
}

/** The admin names a device after the person who uses it, like "Anvarov Muhammadamin". */
async function renameDevice(d) {
  const field = el("input");
  field.type = "text";
  field.maxLength = 60;
  field.value = d.fullName || "";
  field.placeholder = "Anvarov Muhammadamin";
  const name = await modal({
    title: "Name this device",
    message: "Type the first and last name of the person who uses " + d.model + ". Leave it empty to show the model name again.",
    field, confirmText: "Save"
  });
  if (name === null || name === undefined) return;
  const { status } = await api("/api/admin/device/settings", { deviceId: d.id, fullName: name.trim() });
  toast(status === 200 ? "Name saved." : "Could not save. Try again.");
  await refresh();
  memo = {};
  update();
}

async function saveRules(d, patch, message) {
  const { status, data } = await api("/api/admin/rules", Object.assign({ deviceId: d.id }, patch));
  if (status === 200) toast(message || "Saved. The device gets it within 10 seconds.");
  else if (status !== 400) toast("Could not save. Try again.");
  await refresh();
  update();
  return { status, data };
}

function updateDevApps(d) {

  $("appSearch").placeholder = pc ? "Search programs" : "Search apps";
  $("blockAllBtn").lastChild.textContent = pc ? "Block all programs" : "Block all apps";
  const known = new Set(d.apps.map((a) => a.p));
  for (const p of [...appView.sel]) if (!known.has(p)) appView.sel.delete(p);

  const bulk = $("appBulk");
  bulk.classList.toggle("hidden", !appView.sel.size);
  if (changed("appBulk", [appView.sel.size, d.id])) {
    bulk.replaceChildren(
      el("span", "title", appView.sel.size + " selected"),
      button("Block", "danger", "ban", () => {
        const next = new Set(d.blockedApps);
        appView.sel.forEach((p) => next.add(p));
        appView.sel.clear();
        saveRules(d, { blockedApps: [...next] });
      }),
      button("Allow", "primary", "check", () => {
        const next = d.blockedApps.filter((p) => !appView.sel.has(p));
        appView.sel.clear();
        saveRules(d, { blockedApps: next });
      }),
      button("Clear", "ghost", null, () => { appView.sel.clear(); memo.apps = ""; memo.appBulk = ""; updateDevice(); })
    );
  }

  if (!changed("apps", [d.id, d.apps, d.blockedApps, appView.q, appView.blockedOnly, [...appView.sel]])) return;
  const list = $("appList");
  list.replaceChildren();
  if (!d.apps.length) {
    list.appendChild(emptyState("apps", pc
      ? "The program list shows up a minute after the computer connects."
      : "The app list shows up a few seconds after the phone connects."));
    return;
  }
  const q = appView.q.trim().toLowerCase();
  const blocked = new Set(d.blockedApps);
  const apps = d.apps
    .filter((a) => !q || a.l.toLowerCase().includes(q) || a.p.toLowerCase().includes(q))
    .filter((a) => !appView.blockedOnly || blocked.has(a.p))
    .sort((a, b) => (!!b.n - !!a.n) || (blocked.has(b.p) - blocked.has(a.p)) || a.l.localeCompare(b.l));
  if (!apps.length) list.appendChild(el("div", "empty", appView.blockedOnly ? "Nothing is blocked here." : "Nothing matches your search."));
  for (const a of apps) {
    const row = el("div", "row");
    const pick = checkbox(appView.sel.has(a.p), "Select " + a.l, (on) => {
      on ? appView.sel.add(a.p) : appView.sel.delete(a.p);
      memo.apps = "";
      updateDevice();
    });
    pick.disabled = !!a.e;
    const info = el("div", "grow");
    const title = el("div", "inline");
    title.appendChild(el("span", "title", a.l));
    if (a.n) title.appendChild(pill("New", "new", "sparkle"));
    info.append(title, el("div", "tiny", a.p));
    const isBlocked = blocked.has(a.p) && !a.e;
    const state = a.e ? pill("Always allowed", "muted", "shield")
      : pill(isBlocked ? "Blocked" : "Allowed", isBlocked ? "blocked" : "allowed", isBlocked ? "ban" : "check");
    const sw = el("label", "switch");
    const box = el("input");
    box.type = "checkbox";
    box.checked = isBlocked;
    box.disabled = !!a.e;
    box.setAttribute("aria-label", "Block " + a.l);
    box.onchange = () => {
      const next = new Set(d.blockedApps);
      if (box.checked) next.add(a.p); else next.delete(a.p);
      saveRules(d, { blockedApps: [...next] });
    };
    sw.append(box, el("span"));
    row.append(pick, info, state, sw);
    list.appendChild(row);
  }
}

async function blockAllApps(d) {
  if (!d || !d.apps.length) return;
  const pc = isPc(d);
  const keep = d.apps.filter((a) => a.e).map((a) => a.l);
  const toBlock = d.apps.filter((a) => !a.e).map((a) => a.p);
  const ok = await modal({
    title: (pc ? "Block all programs on " : "Block all apps on ") + d.name + "?",
    message: toBlock.length + (pc ? " programs" : " apps") + " will be blocked. These always stay allowed so the device keeps working:",
    list: keep.length ? keep : [pc ? "Windows system programs and Curbox" : "Curbox, the home screen, phone, settings and the keyboard"],
    confirmText: "Block all", danger: true
  });
  if (!ok) return;
  saveRules(d, { blockedApps: [...new Set([...d.blockedApps, ...toBlock])] }, "All blocked. The device gets it within 10 seconds.");
}

async function categoryDialog(key, d) {
  if (!d) return;

  choices.push({ value: "all", label: "All devices (" + overview.devices.length + ")" });
  let updated = 0;
  const done = await modal({
    title: "Block " + (CATEGORY_LABELS[key] || key).toLowerCase() + " websites?",
    message: "These websites will be blocked:",
    list: sites, choices, confirmText: "Block",
    onConfirm: async (target) => {
      const body = { add: sites };

      else body.deviceIds = target === "one" ? [d.id] : [...selected];
      const { status, data } = await api("/api/admin/sites/bulk", body);

  if (done === null) return;
  toast(updated ? "Blocked on " + updated + (updated === 1 ? " device." : " devices.") : "Those websites were already blocked.");

// ---------------------------------------------------------------- usage helpers
function isoDay(date) {
  const d = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 10);
}
function daysBack(n) { const d = new Date(); d.setDate(d.getDate() - n); return isoDay(d); }

function fmtDur(ms) {
  if (!ms) return "0m";
  if (ms < 60000) return "1m";
  const m = Math.round(ms / 60000);
  const h = Math.floor(m / 60);
  return h ? h + "h " + (m % 60) + "m" : m + "m";
}

function dayLabel(iso, many) {
  const d = new Date(iso + "T12:00:00");
  return many ? String(d.getDate()) : d.toLocaleDateString([], { weekday: "short" });
}

/** Simple bar chart drawn here, so the panel needs no chart library. values may hold null (no report). */
function barChart(values, labels, titles) {
  const n = values.length;
  // Wide enough to fill a card; bars stay slim when there are only a few days.
  const slot = Math.max(28, 640 / n), h = 150, top = 18, bottom = 22;
  const max = Math.max(1, ...values.map((v) => v || 0));
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", "0 0 " + (n * slot) + " " + (h + top + bottom));
  svg.setAttribute("class", "chart");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Screen time per day");
  const every = n > 16 ? Math.ceil(n / 10) : 1;
  values.forEach((v, i) => {
    const w = Math.min(44, slot * 0.62);
    const x = i * slot + (slot - w) / 2;
    const barH = v ? Math.max(3, (v / max) * h) : 0;
    const g = document.createElementNS(SVG, "g");
    const track = document.createElementNS(SVG, "rect");
    Object.entries({ x, y: top, width: w, height: h, rx: 6, class: "track" }).forEach(([k, val]) => track.setAttribute(k, val));
    g.appendChild(track);
    if (barH) {
      const bar = document.createElementNS(SVG, "rect");
      Object.entries({ x, y: top + h - barH, width: w, height: barH, rx: 6, class: "bar" }).forEach(([k, val]) => bar.setAttribute(k, val));
      g.appendChild(bar);
    }
    const title = document.createElementNS(SVG, "title");
    title.textContent = titles[i] + ": " + (v === null ? "no data" : fmtDur(v));
    g.appendChild(title);
    if (i % every === 0 || i === n - 1) {
      const t = document.createElementNS(SVG, "text");
      Object.entries({ x: x + w / 2, y: h + top + 16, "text-anchor": "middle", class: "label" }).forEach(([k, val]) => t.setAttribute(k, val));
      t.textContent = labels[i];
      g.appendChild(t);
    }
    svg.appendChild(g);
  });
  const peak = document.createElementNS(SVG, "text");
  Object.entries({ x: 2, y: 11, class: "label" }).forEach(([k, val]) => peak.setAttribute(k, val));
  peak.textContent = "Max " + fmtDur(max);
  svg.appendChild(peak);
  return svg;
}

/** Device total (or a reason there is none) with a bar scaled to [max]. */
function usageRow(d, ms, max, noDataText) {
  const row = el("div", "row");
  const info = el("div", "grow");
  info.appendChild(el("div", "title", d.name));
  if (ms === null) {
    info.appendChild(el("div", "tiny", noDataText));
  } else {
    const meter = el("div", "meter");
    const fill = el("span");
    fill.style.width = Math.max(2, Math.round((ms / Math.max(max, 1)) * 100)) + "%";
    meter.appendChild(fill);
    info.appendChild(meter);
  }
  row.append(typeIcon(d), info, el("span", "value", ms === null ? "" : fmtDur(ms)));
  return row;
}

function noUsageText(d) {
  if (!d.hasData) {
    return isPc(d)
      ? "Usage is not available on this computer yet. It starts after someone signs in to Windows."
      : "No usage yet. The phone sends it every 5 minutes.";
  }
  return "No report for this time.";
}

function appTable(apps, limit) {
  const total = apps.reduce((n, a) => n + a.ms, 0);
  const wrap = el("div", "tablewrap");
  if (!apps.length) {
    wrap.appendChild(emptyState("apps", "No app usage for this time yet."));
    return wrap;
  }
  const table = el("table", "plain");
  const head = el("tr");
  ["App", "Type", "Devices", "Time", "Share"].forEach((h) => head.appendChild(el("th", "", h)));
  const thead = el("thead");
  thead.appendChild(head);
  const body = el("tbody");
  for (const a of apps.slice(0, limit)) {
    const tr = el("tr");
    const name = el("td");
    name.append(el("div", "title", a.l), el("div", "tiny", a.p));
    const share = el("td");
    const meter = el("div", "meter");
    const fill = el("span");
    fill.style.width = Math.max(2, Math.round((a.ms / Math.max(total, 1)) * 100)) + "%";
    meter.appendChild(fill);
    share.appendChild(meter);
    tr.append(name, el("td", "small", a.platform === "windows" ? "Computer" : "Phone"),
      el("td", "small", String(a.devices)), el("td", "small strong", fmtDur(a.ms)), share);
    body.appendChild(tr);
  }
  table.append(thead, body);
  wrap.appendChild(table);
  return wrap;
}

/** Usage report rows added up per user: total, each day, and the names of their devices. */
function usageByUser(data) {
  const byUser = {};
  for (const d of data.devices) {
    const u = byUser[d.user] || (byUser[d.user] = { user: d.user, totalMs: 0, daily: data.dates.map(() => null), names: [] });
    u.totalMs += d.totalMs;
    u.names.push(d.name);
    d.daily.forEach((ms, i) => { if (ms !== null) u.daily[i] = (u.daily[i] || 0) + ms; });
  }
  return Object.values(byUser).sort((a, b) => b.totalMs - a.totalMs);
}

/** Which apps one user used between two days, on all their devices. */
async function showUserApps(user, from, to) {
  const { status, data } = await api("/api/admin/usage?from=" + from + "&to=" + to + "&user=" + encodeURIComponent(user));
  if (status !== 200) { toast("Could not load. Try again."); return; }
  const total = data.devices.reduce((n, d) => n + d.totalMs, 0);
  const body = el("div", "stack");
  const when = from === to ? (from === daysBack(0) ? tr("Today") : from) : from + " → " + to;
  body.append(el("p", "muted", when + " · " + tr("Total") + " " + fmtDur(total)));
  const devices = el("div", "chips");
  data.devices.forEach((d) => devices.appendChild(el("span", "chip", d.name + " · " + fmtDur(d.totalMs))));
  body.append(devices, appTable(data.apps, 100));
  await modal({ title: tr("Apps used by") + " " + user, body, confirmText: "Close", wide: true });
}

let dashUsageAt = 0;

async function loadDashUsage(force) {
  if (!force && Date.now() - dashUsageAt < 30000) return;
  dashUsageAt = Date.now();
  const today = daysBack(0);
  const [week, day, log] = await Promise.all([
    api("/api/admin/usage?from=" + daysBack(6) + "&to=" + today),
    api("/api/admin/usage?from=" + today + "&to=" + today),
    api("/api/admin/activity?range=7d")
  ]);
  if (!$("dashChart") || route.page !== "dashboard") return;
  if (week.status === 200) {
    const w = week.data;
    const anyData = w.devices.some((d) => d.hasData);
    $("dashChart").replaceChildren(anyData
      ? barChart(w.dailyTotal, w.dates.map((x) => dayLabel(x, false)), w.dates)
      : emptyState("chart", "No data yet. Phones send usage every 5 minutes after they link."));
    const list = $("dashToday");
    list.replaceChildren();
    const rows = w.devices.map((d) => ({ d, ms: d.daily[d.daily.length - 1] }))
      .sort((a, b) => (b.ms || -1) - (a.ms || -1));
    const max = Math.max(1, ...rows.map((r) => r.ms || 0));
    if (!rows.length) list.appendChild(emptyState("devices", "No devices yet."));
    rows.forEach((r) => list.appendChild(usageRow(r.d, r.ms, max, noUsageText(r.d))));
  }
  if (day.status === 200) {
    const users = usageByUser(day.data).filter((u) => u.totalMs > 0).slice(0, 8);
    const topBox = $("dashTopUsers");
    topBox.replaceChildren();
    if (!users.length) topBox.appendChild(emptyState("users", "No screen time today yet."));
    const topMax = Math.max(1, ...users.map((u) => u.totalMs));
    users.forEach((u, i) => {
      const row = el("div", "row click");
      const info = el("div", "grow");
      const meter = el("div", "meter");
      const fill = el("span");
      fill.style.width = Math.max(2, Math.round((u.totalMs / topMax) * 100)) + "%";
      meter.appendChild(fill);
      info.append(el("div", "title", u.user), el("div", "tiny", u.names.join(", ")), meter);
      row.append(el("div", "rank", String(i + 1)), info, el("span", "value", fmtDur(u.totalMs)));
      row.onclick = () => showUserApps(u.user, today, today);
      topBox.appendChild(row);
    });
    const box = $("dashApps");
    box.replaceChildren();
    const apps = day.data.apps.slice(0, 6);
    if (!apps.length) box.appendChild(emptyState("apps", "No app usage today yet."));
    const max = Math.max(1, ...apps.map((a) => a.ms));
    for (const a of apps) {
      const row = el("div", "row");
      const info = el("div", "grow");
      const meter = el("div", "meter");
      const fill = el("span");
      fill.style.width = Math.max(2, Math.round((a.ms / max) * 100)) + "%";
      meter.appendChild(fill);
      info.append(el("div", "title", a.l), meter);
      row.append(info, el("span", "value", fmtDur(a.ms)));
      box.appendChild(row);
    }
  }
  if (log.status === 200) renderLog($("dashEvents"), log.data.entries.slice(0, 8), true);
}

async function loadReport(force) {
  const key = repQuery() + "|" + (force ? Date.now() : Math.floor(Date.now() / 60000));
  if (key === repKey) return;
  repKey = key;
  const q = repQuery();
  $("repCsv").href = "/api/admin/usage.csv?" + q;
  const { status, data } = await api("/api/admin/usage?" + q);
  if (status !== 200 || !$("repStats") || repQuery() !== q) return;

  const [from, to] = [data.from, data.to];
  const scope = rep.device ? (overview.devices.find((d) => d.id === rep.device) || {}).name
    : rep.user ? "User " + rep.user : "All devices";
  $("repPrintHead").replaceChildren(
    el("h1", "", "Curbox screen time report"),
    el("p", "muted", scope + " · " + (from === to ? from : from + " to " + to) + " · Printed " + new Date().toLocaleString())
  );

  const total = data.devices.reduce((n, d) => n + d.totalMs, 0);
  const withData = data.devices.filter((d) => d.daysReported > 0).length;
  const reportedDays = data.dailyTotal.filter((v, i) => data.devices.some((d) => d.daily[i] !== null)).length;
  const stats = $("repStats");
  stats.replaceChildren();
  for (const [label, value, iconName] of [
    ["Total screen time", fmtDur(total), "chart"],
    ["Daily average", reportedDays ? fmtDur(total / reportedDays) : "No data", "history"],
    ["Devices with data", withData + " of " + data.devices.length, "devices"]
  ]) {
    const c = el("div", "card stat");
    const i = el("div", "icon");
    i.style.background = "var(--primary-soft)";
    i.style.color = "var(--primary)";
    i.appendChild(icon(iconName));
    c.append(i, el("div", "value", value), el("div", "muted small", label));
    stats.appendChild(c);
  }

  const many = data.dates.length > 7;
  $("repChart").replaceChildren(withData
    ? barChart(data.dailyTotal, data.dates.map((x) => dayLabel(x, many)), data.dates)
    : emptyState("chart", "No data for this time yet."));

  const devBox = $("repDevices");
  devBox.replaceChildren();
  if (!data.devices.length) devBox.appendChild(emptyState("devices", "No devices match."));
  const max = Math.max(1, ...data.devices.map((d) => d.totalMs));
  [...data.devices].sort((a, b) => b.totalMs - a.totalMs).forEach((d) => {
    devBox.appendChild(usageRow(d, d.daysReported ? d.totalMs : null, max, noUsageText(d)));

  $("repApps").replaceChildren(appTable(data.apps, 50));

// ---------------------------------------------------------------- shared rule helpers
const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

function receivedPill(d) {
  return d.received ? pill("Received", "ok", "check") : pill("Waiting for the device", "warn");
}

function daysText(days) {
  const set = [...new Set(days)].sort((a, b) => a - b);
  if (set.length === 7) return "Every day";
  if (set.join() === "1,2,3,4,5") return "Mon to Fri";
  if (set.join() === "6,7") return "Sat and Sun";
  const run = set.length > 2 && set.every((d, i) => i === 0 || d === set[i - 1] + 1);
  if (run) return DAY_NAMES[set[0] - 1] + " to " + DAY_NAMES[set[set.length - 1] - 1];
  return set.map((d) => DAY_NAMES[d - 1]).join(", ");
}

function toMinute(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }

/** Minutes of the week (0 = Monday 00:00) a schedule covers; an end before the start runs past midnight. */
function scheduleMinutes(s) {
  const week = new Uint8Array(7 * 1440);
  const start = toMinute(s.start), end = toMinute(s.end);
  for (const day of s.days) {
    const base = (day - 1) * 1440;
    const length = end > start ? end - start : 1440 - start + end;
    for (let i = 0; i < length; i++) week[(base + start + i) % week.length] = 1;
  }
  return week;
}

function limitText(min) {
  if (!min) return "No limit";
  return min % 60 === 0 ? (min / 60) + " h a day" : min >= 60 ? Math.floor(min / 60) + " h " + (min % 60) + " min a day" : min + " min a day";
}

  }
  const usageById = {};
  (limitUsage ? limitUsage.devices : []).forEach((d) => { usageById[d.id] = d; });
  const rows = overview.devices.map((d) => [d.id, d.name, d.platform, d.dailyLimitMinutes, d.received, (usageById[d.id] || {}).daily]);
  if (!changed("limits", [rows, tick()])) return;
  const body = $("limitTable");
  body.replaceChildren();
  $("limitEmpty").replaceChildren();
  if (!overview.devices.length) $("limitEmpty").appendChild(emptyState("devices", "No devices yet."));
  for (const d of overview.devices) {
    const u = usageById[d.id];
    const used = u ? u.daily[0] : null;
    const tr = el("tr");
    const name = el("td");
    const inner = el("div", "inline");
    const info = el("div");
    info.append(el("div", "title", d.name), el("div", "tiny", d.user));
    inner.append(typeIcon(d), info);
    name.appendChild(inner);

    const limitCell = el("td");
    const presets = [[0, "No limit"], [30, "30 min"], [60, "1 h"], [120, "2 h"], [180, "3 h"]];
    const options = presets.map(([v, t]) => [String(v), t]);
    if (!presets.some(([v]) => v === d.dailyLimitMinutes)) options.push([String(d.dailyLimitMinutes), limitText(d.dailyLimitMinutes)]);
    options.push(["custom", "Custom…"]);
    const sel = selectBox(options, String(d.dailyLimitMinutes), "Daily limit for " + d.name, async (v) => {
      let minutes = Number(v);
      if (v === "custom") {
        const typed = await modal({
          title: "Daily limit for " + d.name, message: "Minutes a day, from 1 to 1440. For example 90 is an hour and a half.",
          input: { type: "number", placeholder: "90" }, confirmText: "Save"
        });
        minutes = Number(typed);
        if (typed === null || !Number.isInteger(minutes) || minutes < 1 || minutes > 1440) {
          if (typed !== null) toast("Type a whole number from 1 to 1440.");
          memo.limits = "";
          updateScreenTime();
          return;
        }
      }
      const { status } = await api("/api/admin/limits", { deviceIds: [d.id], dailyLimitMinutes: minutes });
      toast(status === 200 ? "Saved. The device gets it within 10 seconds." : "Could not save. Try again.");
      await refresh();
      update();
    });
    limitCell.appendChild(sel);
    if (isPc(d) && d.dailyLimitMinutes && !(u && u.hasData)) {
      limitCell.appendChild(el("div", "tiny", "Needs usage from this computer. It starts after someone signs in to Windows."));
    }

    const left = d.dailyLimitMinutes && used !== null ? Math.max(0, d.dailyLimitMinutes * 60000 - used) : null;
    const leftCell = el("td", "small");
    if (!d.dailyLimitMinutes) leftCell.textContent = "";
    else if (left === null) leftCell.textContent = "No data yet";
    else if (left === 0) leftCell.appendChild(pill("Limit reached", "blocked", "ban"));
    else leftCell.textContent = fmtDur(left);

    const status = el("td");
    status.appendChild(receivedPill(d));
    tr.append(name, limitCell, el("td", "small strong", used === null ? "No data" : fmtDur(used)), leftCell, status);
    body.appendChild(tr);
  }
}

async function saveWarnings() {
  const parts = $("warnInput").value.split(/[\s,]+/).filter(Boolean).map(Number);
  $("warnError").textContent = "";
  if (!parts.length || parts.length > 5 || parts.some((n) => !Number.isInteger(n) || n < 1 || n > 600)) {
    $("warnError").textContent = "Type up to five whole numbers from 1 to 600, like 60, 30, 10.";
    return;
  }
  const { status } = await api("/api/admin/limits", { all: true, warningMinutes: parts });
  toast(status === 200 ? "Warnings saved for all devices." : "Could not save. Try again.");
  await refresh();
  update();
}

// ---------------------------------------------------------------- schedules
let scheduleDevice = "";
const TEMPLATES = {
  study: { name: "Study mode", days: [1, 2, 3, 4, 5], start: "08:00", end: "14:00", blockAllApps: true, blockApps: [], blockSites: [] },
  sleep: { name: "Sleep", days: [1, 2, 3, 4, 5, 6, 7], start: "22:00", end: "07:00", blockAllApps: true, blockApps: [], blockSites: [] }
};

function currentScheduleDevice() {
  const d = overview.devices.find((x) => x.id === scheduleDevice) || overview.devices[0];
  scheduleDevice = d ? d.id : "";
  return d;
}

function mountSchedules(content) {
  setTitle("Schedules");
  if (route.id) scheduleDevice = route.id;
  const bar = el("div", "toolbar");
  const sel = selectBox([], "", "Device", (v) => { scheduleDevice = v; memo.schedules = ""; updateSchedules(); });
  sel.id = "schedDevice";
  bar.append(sel,
    button("Add schedule", "primary", "plus", () => editSchedule(null)),
    button("Study mode", "ghost", "sparkle", () => editSchedule(null, TEMPLATES.study)),
    button("Sleep", "ghost", "sparkle", () => editSchedule(null, TEMPLATES.sleep)));
  const head = el("div");
  head.id = "schedHead";
  const week = card("This week", "chart", "Shaded hours have a schedule on. Times are the device's own local time.");
  const grid = el("div", "weekgrid");
  grid.id = "schedGrid";
  const overlap = el("div");
  overlap.id = "schedOverlap";

function updateSchedules() {
  const sel = $("schedDevice");
  if (!sel) return;
  const d = currentScheduleDevice();
  if (changed("schedOptions", overview.devices.map((x) => [x.id, x.name]))) {
    sel.replaceChildren(...overview.devices.map((x) => new Option(x.name + (isPc(x) ? " (computer)" : " (phone)"), x.id)));
  }
  sel.value = scheduleDevice;
  if (!d) {
    $("schedList").replaceChildren(emptyState("devices", "No devices yet. Connect one first."));
    return;
  }
  if (!changed("schedules", [d.id, d.schedules, d.received, d.apps.length])) return;

  const head = el("div", "row");
  const info = el("div", "grow");
  info.append(el("div", "title", d.name), el("div", "tiny", d.user + " · " + osText(d) + " · " + d.schedules.length + " schedules"));
  head.append(typeIcon(d), info, receivedPill(d));
  const headCard = el("section", "card");
  headCard.appendChild(head);
  $("schedHead").replaceChildren(headCard);

  // Week grid: 7 rows of 24 hours; an hour is shaded when any minute of it is covered.
  const enabled = d.schedules.filter((s) => s.enabled);
  const maps = enabled.map((s) => ({ s, week: scheduleMinutes(s) }));
  const grid = $("schedGrid");
  grid.replaceChildren(el("span", "corner"));
  for (let h = 0; h < 24; h++) grid.appendChild(el("span", "hour", h % 3 === 0 ? String(h).padStart(2, "0") : ""));
  for (let day = 0; day < 7; day++) {
    grid.appendChild(el("span", "dayname", DAY_NAMES[day]));
    for (let h = 0; h < 24; h++) {
      const from = day * 1440 + h * 60;
      const names = maps.filter(({ week }) => week.subarray(from, from + 60).some((v) => v)).map(({ s }) => s.name);
      const cell = el("span", "cell" + (names.length > 1 ? " both" : names.length ? " on" : ""));
      cell.title = DAY_NAMES[day] + " " + String(h).padStart(2, "0") + ":00" + (names.length ? ": " + names.join(", ") : "");
      grid.appendChild(cell);
    }
  }

  // Overlaps are allowed, but the admin should know.
  const notes = [];
  for (let i = 0; i < maps.length; i++) {
    for (let j = i + 1; j < maps.length; j++) {
      const at = maps[i].week.findIndex((v, k) => v && maps[j].week[k]);
      if (at >= 0) {
        notes.push(maps[i].s.name + " and " + maps[j].s.name + " overlap, for example " + DAY_NAMES[Math.floor(at / 1440)] + " " +
          String(Math.floor((at % 1440) / 60)).padStart(2, "0") + ":" + String(at % 60).padStart(2, "0") + ". Both apply then.");
      }
    }
  }
  $("schedOverlap").replaceChildren(...notes.map((n) => el("p", "small warntext", n)));

  const box = $("schedList");
  box.replaceChildren();
  if (!d.schedules.length) box.appendChild(emptyState("history", "No schedules yet. Add one, or start from Study mode or Sleep."));
  const labels = Object.fromEntries(d.apps.map((a) => [a.p, a.l]));
  d.schedules.forEach((s, index) => {
    const row = el("div", "row");
    const sw = el("label", "switch on");
    const box2 = el("input");
    box2.type = "checkbox";
    box2.checked = s.enabled;
    box2.setAttribute("aria-label", (s.enabled ? "Turn off " : "Turn on ") + s.name);
    box2.onchange = () => {
      const next = d.schedules.map((x, i) => i === index ? Object.assign({}, x, { enabled: box2.checked }) : x);
      saveSchedules(d, next, box2.checked ? s.name + " is on." : s.name + " is off.");
    };
    sw.append(box2, el("span"));
    const info2 = el("div", "grow");
    const what = s.blockAllApps ? "Blocks all apps except calls and settings"
      : [s.blockApps.length ? s.blockApps.map((p) => labels[p] || p).slice(0, 3).join(", ") + (s.blockApps.length > 3 ? " and " + (s.blockApps.length - 3) + " more" : "") : "",
        s.blockSites.length ? s.blockSites.slice(0, 3).join(", ") + (s.blockSites.length > 3 ? " and more" : "") : ""].filter(Boolean).join(" · ");
    info2.append(el("div", "title", s.name), el("div", "tiny", daysText(s.days) + ", " + s.start + " to " + s.end + (toMinute(s.end) < toMinute(s.start) ? " (next day)" : "")),
      el("div", "tiny", what + (s.blockAllApps && s.blockSites.length ? " · " + s.blockSites.join(", ") : "")));
    const edit = button("Edit", "ghost small", null, () => editSchedule(index));
    const del = button("", "danger small", "trash", async () => {
      const ok = await modal({ title: "Delete " + s.name + "?", message: "It stops on " + d.name + " at the next sync.", confirmText: "Delete", danger: true });
      if (ok) saveSchedules(d, d.schedules.filter((_, i) => i !== index), "Schedule deleted.");
    });
    del.setAttribute("aria-label", "Delete " + s.name);
    row.append(sw, info2, edit, del);
    box.appendChild(row);
  });
}

async function saveSchedules(d, schedules, message) {
  const { status, data } = await api("/api/admin/schedules/save", { deviceId: d.id, schedules });
  if (status !== 200) toast(data.error === "bad_site" ? siteError(data) : "Could not save. Check the schedule and try again.");
  else toast(message || "Saved. The device gets it within 10 seconds.");
  await refresh();
  memo.schedules = "";
  update();
  return status === 200;
}

/** The schedule editor: name, days, times, what it blocks, and (for a new one) which devices get it. */
async function editSchedule(index, template) {
  const d = currentScheduleDevice();
  if (!d) return;
  const base = index === null ? Object.assign({ name: "", days: [1, 2, 3, 4, 5], start: "08:00", end: "14:00", blockAllApps: false, blockApps: [], blockSites: [] }, template || {})
    : d.schedules[index];
  const form = el("div", "form");
  const name = el("input");
  name.value = base.name;
  name.placeholder = "Like Homework";
  name.maxLength = 40;
  const dayBox = el("div", "seg days");
  const days = new Set(base.days);
  DAY_NAMES.forEach((label, i) => {
    const b = button(label, days.has(i + 1) ? "on" : "", null, () => {
      days.has(i + 1) ? days.delete(i + 1) : days.add(i + 1);
      b.classList.toggle("on", days.has(i + 1));
      b.setAttribute("aria-pressed", String(days.has(i + 1)));
    });
    b.setAttribute("aria-pressed", String(days.has(i + 1)));
    dayBox.appendChild(b);
  });
  const times = el("div", "inline");
  const start = el("input");
  start.type = "time";
  start.value = base.start;
  start.setAttribute("aria-label", "Start");
  const end = el("input");
  end.type = "time";
  end.value = base.end;
  end.setAttribute("aria-label", "End");
  times.append(start, el("span", "muted", "to"), end);
  const allRow = el("label", "choice");
  const all = el("input");
  all.type = "checkbox";
  all.checked = base.blockAllApps;
  allRow.append(all, document.createTextNode("Block all apps (calls, emergency, alarms and settings stay open)"));

  const pick = new Set(base.blockApps);
  const appSearch = el("input");
  appSearch.placeholder = isPc(d) ? "Search programs" : "Search apps";
  const appList = el("div", "picklist");
  const drawApps = () => {
    appList.replaceChildren();
    const q = appSearch.value.trim().toLowerCase();
    const apps = d.apps.filter((a) => !a.e && (!q || a.l.toLowerCase().includes(q) || a.p.toLowerCase().includes(q)))
      .sort((a, b) => (pick.has(b.p) - pick.has(a.p)) || a.l.localeCompare(b.l));
    if (!d.apps.length) appList.appendChild(el("p", "small muted", "The app list shows up after the device connects."));
    for (const a of apps) {
      const row = el("label", "choice");
      const c = el("input");
      c.type = "checkbox";
      c.checked = pick.has(a.p);
      c.onchange = () => { c.checked ? pick.add(a.p) : pick.delete(a.p); };
      row.append(c, document.createTextNode(a.l));
      appList.appendChild(row);
    }
  };
  appSearch.oninput = drawApps;
  drawApps();
  const appsBlock = el("div");
  appsBlock.append(el("label", "field", isPc(d) ? "Programs to block" : "Apps to block"), appSearch, appList);
  const syncAll = () => appsBlock.classList.toggle("hidden", all.checked);
  all.onchange = syncAll;
  syncAll();
  const sites = el("input");
  sites.value = base.blockSites.join(", ");
  sites.placeholder = "youtube.com, tiktok.com";

  form.append(el("label", "field", "Name"), name, el("label", "field", "Days"), dayBox,
    el("label", "field", "Time (the device's local time; an end before the start means the next day)"), times,
    el("label", "field", "What to block"), allRow, appsBlock, el("label", "field", "Websites to block"), sites);

  const isNew = index === null;
  const done = await modal({
    title: isNew ? "New schedule" : "Edit " + base.name,
    body: form, wide: true,
    choices: isNew && overview.devices.length > 1 ? [{ value: "one", label: "Only " + d.name }, { value: "all", label: "All devices (" + overview.devices.length + ")" }] : null,
    confirmText: "Save",
    onConfirm: async (target) => {
      const schedule = Object.assign({}, isNew ? {} : base, {
        name: name.value.trim(), days: [...days].sort(), start: start.value, end: end.value,
        blockAllApps: all.checked, blockApps: all.checked ? [] : [...pick], blockSites: splitSites(sites.value),
        enabled: isNew ? true : base.enabled
      });
      if (!schedule.name) return "Give the schedule a name.";
      if (!schedule.days.length) return "Pick at least one day.";
      if (!schedule.start || !schedule.end || schedule.start === schedule.end) return "Pick a start and an end time that are not the same.";
      if (!schedule.blockAllApps && !schedule.blockApps.length && !schedule.blockSites.length) return "Choose what to block: all apps, some apps, or websites.";
      let res;
      if (isNew && target === "all") {
        res = await api("/api/admin/schedules/add", { all: true, schedule });
      } else {
        const list = isNew ? [...d.schedules, schedule] : d.schedules.map((x, i) => i === index ? schedule : x);
        res = await api("/api/admin/schedules/save", { deviceId: d.id, schedules: list });
      }
      if (res.status === 200) return null;
      if (res.data.error === "bad_site") return siteError(res.data);
      if (res.data.error === "too_many") return "A device can have up to 20 schedules.";
      return "Could not save. Check the schedule and try again.";
    }
  });
  if (done === null) return;
  toast("Saved. The device gets it within 10 seconds.");
  await refresh();
  memo.schedules = "";
  update();
}

  if (!rows.length) box.appendChild(el("div", "tiny", "None"));

}

function renderRuleSources(d) {
  const box = $("devRules");
  if (!box) return;
  const e = d.effective.explain;
  const groups = (overview.groups || []).filter((g) => g.deviceIds.includes(d.id)).map((g) => g.name);
  box.replaceChildren(el("p", "small muted", groups.length ? "Groups: " + groups.join(", ") : "Not in any group."));
  if (d.pending) box.appendChild(el("p", "small warntext", "Waiting for approval. None of these rules apply yet."));
  for (const c of e.conflicts) box.appendChild(el("p", "small warntext", c));
  box.append(
    sourceList(isPc(d) ? "Blocked programs" : "Blocked apps", e.apps, (r) => r.label),
    sourceList("Blocked websites", e.sites, (r) => r.site),
    sourceList("Only these websites", e.allowSites, (r) => r.site, isPc(d) ? "Allow lists only work on phones." : "Every other website is blocked."),
    sourceList("Daily limit", e.limit.minutes ? [{ minutes: e.limit.minutes, source: e.limit.source }] : [], (r) => limitText(r.minutes)),
    sourceList("Schedules", e.schedules, (r) => r.name + ", " + daysText(r.days) + " " + r.start + " to " + r.end)
  );
}

function updateGroups() {

      el("div", "tiny", usedBy.length ? "Profiles: " + usedBy.join(", ") : "No profile"));

async function saveGroups(list, message) {
  const { status, data } = await api("/api/admin/groups/save", { groups: list });
  if (status === 200) toast(message);
  await refresh();
  memo.groups = "";
  update();
  return status === 200 ? null : (data.error === "duplicate_name" ? "Another group already has this name." : "Could not save. Try again.");
}

async function newGroup() {
  await modal({
    title: "New group", message: "For example Class 8A.", input: { placeholder: "Group name" }, confirmText: "Create",
    onConfirm: async (name) => name.trim() ? saveGroups([...overview.groups, { name: name.trim(), deviceIds: [] }], "Group created.") : "Type a name."
  });

async function renameGroup(index) {
  const g = overview.groups[index];
  const field = el("input");
  field.value = g.name;
  await modal({
    title: "Rename " + g.name, field, confirmText: "Save",
    onConfirm: async (name) => name.trim()
      ? saveGroups(overview.groups.map((x, i) => i === index ? Object.assign({}, x, { name: name.trim() }) : x), "Group renamed.")
      : "Type a name."
  });
}

function checklist(items, chosen) {
  const list = el("div", "picklist");
  for (const [value, label] of items) {
    const row = el("label", "choice");
    const c = el("input");
    c.type = "checkbox";
    c.checked = chosen.has(value);
    c.onchange = () => { c.checked ? chosen.add(value) : chosen.delete(value); };
    row.append(c, document.createTextNode(label));
    list.appendChild(row);
  }
  if (!items.length) list.appendChild(el("p", "small muted", "Nothing to choose yet."));
  return list;
}

async function groupMembers(index) {
  const g = overview.groups[index];
  const chosen = new Set(g.deviceIds);
  await modal({
    title: "Devices in " + g.name,
    body: checklist(overview.devices.map((d) => [d.id, d.name + " (" + d.user + ")"]), chosen),
    confirmText: "Save",
    onConfirm: () => saveGroups(overview.groups.map((x, i) => i === index ? Object.assign({}, x, { deviceIds: [...chosen] }) : x), "Saved.")
  });
}

function assignText(p) {
  const parts = [];
  const groupNames = overview.groups.filter((g) => p.assign.groups.includes(g.id)).map((g) => "group " + g.name);
  const deviceNames = overview.devices.filter((d) => p.assign.devices.includes(d.id)).map((d) => d.name);
  parts.push(...groupNames, ...p.assign.users.map((u) => "user " + u), ...deviceNames);
  return parts.length ? "Given to " + parts.join(", ") : "Not given to anyone yet";
}

function profileSummary(p) {
  const parts = [];
  if (p.apps.length) parts.push(p.apps.map((a) => a.name).slice(0, 4).join(", ") + (p.apps.length > 4 ? " and " + (p.apps.length - 4) + " more" : ""));
  if (p.sites.length) parts.push(p.sites.length + (p.sites.length === 1 ? " website" : " websites"));
  if (p.allowSites.length) parts.push("only " + p.allowSites.length + " websites allowed (phones)");
  if (p.dailyLimitMinutes) parts.push(limitText(p.dailyLimitMinutes));
  if (p.mode === "schedule") parts.push(p.windows.map((w) => daysText(w.days) + " " + w.start + " to " + w.end + (w.blockAllApps ? ", all apps" : "")).join("; "));
  return parts.join(" · ") || "No rules yet";
}

function updateProfiles() {
  if (!changed("profiles", [overview.profiles, overview.groups, overview.devices.map((d) => [d.id, d.name])])) return;
  const box = $("profileList");
  box.replaceChildren();
  if (!overview.profiles.length) box.appendChild(emptyState("shield", "No profiles yet. Make one, like Study Mode, and give it to a group."));

    const row = el("div", "row");
    const sw = el("label", "switch on");

    c.type = "checkbox";
    c.checked = p.enabled;
